##### Ghostty-friendly basics #####
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g mouse on
set -sg escape-time 0
set -g history-limit 100000
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### Powerline glyphs #####
# Nerd Font separators
set -g @pl_left_sep  ""
set -g @pl_right_sep ""
set -g @pl_sep       ""

##### Pane borders #####
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

##### Message / copy-mode styling #####
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#89b4fa,fg=#11111b"

##### Status bar: Powerline look #####
set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-left-length 80
set -g status-right-length 120
set -g status-style "bg=#11111b,fg=#cdd6f4"

# Make window titles “tight”
setw -g window-status-separator ""

##### Left: session + path #####
# Segment colors (Catppuccin-ish, looks great on dark)
# session:  bg blue  -> text dark
# userhost: bg teal  -> text dark
# path:     bg gray  -> text light
set -g status-left "\
#[bg=#89b4fa,fg=#11111b,bold] #S \
#[bg=#94e2d5,fg=#585b70]#{@pl_left_sep}\
#[bg=#585b70,fg=#cdd6f4] #{pane_current_path} \
#[bg=#585b70,fg=#11111b]#{@pl_left_sep}\
#[default]"

##### Windows: fully powerline styled tabs #####
# Inactive window tab
setw -g window-status-format "\
#[bg=#1e1e2e,fg=#6c7086]#{@pl_right_sep}\
#[bg=#1e1e2e,fg=#cdd6f4] #I#{@pl_sep}#W \
#[bg=#11111b,fg=#1e1e2e]#{@pl_right_sep}"

# Active window tab (highlight)
setw -g window-status-current-format "\
#[bg=#11111b,fg=#89b4fa]#{@pl_right_sep}\
#[bg=#89b4fa,fg=#11111b,bold] #I#{@pl_sep}#W \
#[bg=#11111b,fg=#89b4fa]#{@pl_right_sep}"

##### Right: git branh #####
# Git branch (fast-ish): shows branch if inside a git repo
set -g @git_branch '$(git -C "#{pane_current_path}" rev-parse --abbrev-ref HEAD 2>/dev/null)'

set -g status-right "\
#[bg=#11111b,fg=#45475a]#{@pl_right_sep}\
#[bg=#45475a,fg=#cdd6f4]  #{=@git_branch} \
#[bg=#45475a,fg=#cdd6f4]#{@pl_right_sep}\
#[default]"

##### Keybind QoL #####
bind | split-window -h
bind - split-window -v
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-hightlight'

run '~/.tmux/plugins/tpm/tpm'
